name: Publish Release Tag and Image

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  create-release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from release branch
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          if [[ "${BRANCH_NAME}" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="v${BASH_REMATCH[1]}"
            echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
            echo "Extracted version from branch: ${VERSION}"
          else
            echo "Manual release publish must be run from a release/x.y.z branch. Current ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Validate tag does not already exist
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release_version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists. This release version is already finalized."
            exit 1
          fi

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release_version.outputs.version }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Compute image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LOWER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_LOWER="$(echo "${REPO_NAME}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LOWER}/${REPO_LOWER}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "Resolved image: ${IMAGE}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image for release tag
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}:${{ steps.release_version.outputs.version }}
